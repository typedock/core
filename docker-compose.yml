# TypeDock development compose file.
#
# Default (lightest) stack — just app + nginx, using SQLite on disk:
#   docker compose up -d
#
# Optional databases via profiles:
#   docker compose --profile mysql    up -d
#   docker compose --profile postgres up -d
#
# Security scanning via profile (one-shot, see bin/security-scan.sh):
#   docker compose --profile zap run --rm zap            # baseline (passive only)
#   docker compose --profile zap run --rm zap-full       # spider + active scan

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: typedock/app:dev
    working_dir: /app
    volumes:
      - ./:/app
      - app-storage:/app/storage
      # Upload target for MediaService with the local storage driver.
      # Uses a named volume for the same reason storage/ does: Docker
      # initialises it from the image layer where /app/public/uploads is
      # owned by www-data, so php-fpm can write to it without any UID
      # juggling against the bind-mounted host filesystem.
      - app-uploads:/app/public/uploads
      # Published theme/plugin assets. Named volumes — not bind mounts —
      # so writes from the app container succeed without UID juggling
      # against the host filesystem (same pattern as app-uploads). They
      # MUST be mirrored onto the nginx service (read-only) as well so
      # nginx sees the same view; otherwise AssetPublisher's writes land
      # in the volume while nginx keeps serving the stale host directory.
      - app-themes:/app/public/themes
      - app-plugins:/app/public/plugins
    env_file:
      - path: docker.env
        required: false
    expose:
      - "9000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/app:ro
      - app-storage:/app/storage:ro
      - app-uploads:/app/public/uploads:ro
      # Must mirror every rw volume the app service declares underneath
      # /app/public so nginx reads the same bytes AssetPublisher wrote.
      - app-themes:/app/public/themes:ro
      - app-plugins:/app/public/plugins:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  db-admin:
    image: ghcr.io/uplucid/php-db-admin:latest
    ports:
      - "8081:8080"
    environment:
      DB_DRIVER: sqlite
      DB_PATH: /app/storage/database.sqlite
    volumes:
      - app-storage:/app/storage
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    profiles: ["mysql"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: typedock
      MYSQL_USER: typedock
      MYSQL_PASSWORD: typedock
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: typedock
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: typedock
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

  # OWASP ZAP — baseline (passive only) scan via Automation Framework.
  # Safe to run against any environment. Reports land directly on the host at
  # ./storage/zap-reports/ via bind mount. The host directory must be
  # world-writable (chmod 777) because the ZAP container runs as uid 1000;
  # bin/security-scan.sh handles that. This is zaproxy's own recommended
  # workaround.
  #
  # NOTE: we drive baseline through the Automation Framework rather than the
  # `zap-baseline.py` wrapper, because the wrapper writes a generated YAML to
  # /zap/wrk/zap.yaml and our /zap/wrk/conf is mounted read-only.
  zap:
    image: zaproxy/zap-stable:latest
    profiles: ["zap"]
    depends_on:
      - nginx
    volumes:
      - ./docker/zap:/zap/wrk/conf:ro
      - ./storage/zap-reports:/zap/wrk/reports
    restart: "no"
    command:
      - zap.sh
      - -cmd
      - -autorun
      - /zap/wrk/conf/baseline.yaml

  # OWASP ZAP — full scan via Automation Framework (spider + passive + active).
  # Runs the YAML at docker/zap/full.yaml. Active scanning sends real exploit
  # payloads, so do NOT point this at production.
  zap-full:
    image: zaproxy/zap-stable:latest
    profiles: ["zap"]
    depends_on:
      - nginx
    volumes:
      - ./docker/zap:/zap/wrk/conf:ro
      - ./storage/zap-reports:/zap/wrk/reports
    restart: "no"
    command:
      - zap.sh
      - -cmd
      - -autorun
      - /zap/wrk/conf/full.yaml

  # OWASP ZAP — authenticated active scan against /admin/*. Requires the app
  # to be started with APP_DEBUG=true + SECURITY_SCAN_MODE=true so the CSRF
  # middleware lets ZAP through. See docker/zap/admin.yaml for the full
  # contract and bin/security-scan.sh for the orchestration. ZAP_ADMIN_USER /
  # ZAP_ADMIN_PASS are read from docker.env at scan time.
  zap-admin:
    image: zaproxy/zap-stable:latest
    profiles: ["zap"]
    depends_on:
      - nginx
    env_file:
      - path: docker.env
        required: false
    volumes:
      - ./docker/zap:/zap/wrk/conf:ro
      - ./storage/zap-reports:/zap/wrk/reports
    restart: "no"
    command:
      - zap.sh
      - -cmd
      - -autorun
      - /zap/wrk/conf/admin.yaml

volumes:
  app-storage:
  app-uploads:
  app-themes:
  app-plugins:
  mysql-data:
  pg-data:
