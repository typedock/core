name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          show-patched-versions: true

  security-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip
          coverage: none
          tools: composer:v2

      - name: Composer audit
        run: composer audit --locked --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: npm audit
        run: npm audit --package-lock-only --audit-level=moderate

  test:
    name: PHPUnit (${{ matrix.driver }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - driver: sqlite
          - driver: mysql
            db_host: 127.0.0.1
            db_port: 3306
            db_user: root
            db_password: typedock
          - driver: pgsql
            db_host: 127.0.0.1
            db_port: 5432
            db_user: postgres
            db_password: typedock

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: typedock
          MYSQL_DATABASE: typedock
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: typedock
          POSTGRES_DB: typedock
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      APP_ENV: testing
      APP_DEBUG: "true"
      # Deterministic 32-byte key for CI. Generated via:
      #   php -r 'echo "base64:" . base64_encode(str_repeat("a", 32)) . PHP_EOL;'
      # Never reused outside CI — production sites generate their own.
      APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      DB_DRIVER: ${{ matrix.driver }}
      DB_HOST: ${{ matrix.db_host }}
      DB_PORT: ${{ matrix.db_port }}
      DB_DATABASE: typedock
      DB_USERNAME: ${{ matrix.db_user }}
      DB_PASSWORD: ${{ matrix.db_password }}
      DB_SQLITE_PATH: ${{ github.workspace }}/storage/database.sqlite

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, pdo_mysql, pdo_pgsql, zip, gd, mbstring, intl, json
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare storage directories
        run: mkdir -p storage/{cache,logs,sessions,tmp,uploads,backups,import}

      - name: Run migrations
        run: php cli/migrate.php

      - name: PHPUnit
        run: vendor/bin/phpunit --testdox

      # The PHPUnit suite builds its own SQLite database for isolation, so on
      # the MySQL and PostgreSQL legs it only ever proves the migrations apply
      # — no query in the application is executed against those drivers. A
      # real import is the cheapest way to close that gap: one command
      # exercises the optimistic job claim (which depends on rowCount
      # semantics), the import lease, upserts, SEO meta writes, COALESCE, and
      # the link rewriter, on whichever driver this leg is running.
      #
      # Image downloads are expected to fail here: the fixture points at a
      # host that does not exist. That is not what this step is checking.
      - name: End-to-end import against ${{ matrix.driver }}
        run: |
          set -e
          php cli/import.php --importer=wordpress tests/fixtures/wxr/sample.xml \
            | tee /tmp/import-first.txt
          grep -q 'created=5 updated=0' /tmp/import-first.txt

          # Re-running the same file must update rather than duplicate.
          php cli/import.php --importer=wordpress tests/fixtures/wxr/sample.xml \
            | tee /tmp/import-second.txt
          grep -q 'created=0 updated=5' /tmp/import-second.txt

  static-analysis:
    name: PHP syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      # Belt-and-braces: catch syntax errors that would otherwise only surface
      # when Composer's autoloader actually tries to require the file. Quick;
      # complements the PHPUnit matrix above without needing a full DB.
      - name: php -l on src + plugins + tests
        run: |
          set -e
          find src plugins tests cli -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHPStan
        run: composer analyse

  package:
    name: Distribution package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, zip, gd, mbstring, intl, json
          coverage: none
          tools: composer:v2

      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rsync zip

      # Keep this in sync with .github/workflows/release.yml. If packaging
      # breaks, the PR should fail before a tag starts the release workflow.
      - name: Build distribution zip
        run: bash build/make-shared-zip.sh
        env:
          OUT_DIR: ${{ github.workspace }}/dist

      - name: Assert distribution contents and budgets
        run: |
          set -euo pipefail
          stage="dist/typedock-shared"
          files="$(find "$stage" -type f | wc -l)"
          bytes="$(find "$stage" -type f -printf '%s\n' | awk '{sum += $1} END {print sum + 0}')"
          zip_bytes="$(stat -c %s dist/typedock-shared.zip)"

          echo "Distribution: ${files} files, ${bytes} bytes, zip ${zip_bytes} bytes"
          # Initial guardrails are the measured post-cleanup package plus
          # approximately 5% headroom. Raising them requires an explicit diff.
          test "$files" -le 1566
          test "$bytes" -le 6000000
          test "$zip_bytes" -le 2400000

          test -z "$(find "$stage" -type f \( -name '*.sqlite' -o -name '*.sqlite-wal' -o -name '*.sqlite-shm' \) -print -quit)"
          test -z "$(find "$stage" -type f \( -iname 'Dockerfile*' -o -iname 'Makefile*' -o -iname 'docker-compose*' \) -print -quit)"
          for forbidden in \
            "$stage/typedock/.preview" \
            "$stage/typedock/docs-internal" \
            "$stage/typedock/node_modules" \
            "$stage/typedock/tests" \
            "$stage/typedock/admin/src"; do
            test ! -e "$forbidden"
          done
          test ! -e "$stage/typedock/config.php"
          test -f "$stage/typedock/config.php.example"
          test ! -e "$stage/typedock/plugins/cloud-storage"
          php -r '
            $manifest = json_decode((string) file_get_contents($argv[1]), true);
            if (!is_array($manifest) || count((array) ($manifest["file_hashes"] ?? [])) === 0) {
                fwrite(STDERR, "Package manifest has no file hashes.\n");
                exit(1);
            }
            $bundled = (array) ($manifest["bundled_plugins"] ?? []);
            $actual = array_values(array_filter(
                scandir($argv[2] . "/plugins") ?: [],
                fn(string $entry): bool => $entry[0] !== "." && is_dir($argv[2] . "/plugins/" . $entry),
            ));
            sort($bundled);
            sort($actual);
            if ($bundled !== $actual) {
                fwrite(STDERR, "Bundled plugin list does not match the package.\n");
                exit(2);
            }
            foreach ($manifest["file_hashes"] as $path => $expected) {
                $full = str_starts_with($path, "public/")
                    ? $argv[3] . "/" . substr($path, strlen("public/"))
                    : $argv[2] . "/" . $path;
                if (!is_file($full) || "sha256:" . hash_file("sha256", $full) !== $expected) {
                    fwrite(STDERR, "Package manifest hash mismatch: {$path}\n");
                    exit(3);
                }
            }
          ' \
            "$stage/typedock/typedock-package.json" \
            "$stage/typedock" \
            "$stage/public_html"

      - name: Build optional Cloud Storage plugin
        run: bash build/make-plugin-zip.sh cloud-storage
        env:
          OUT_DIR: ${{ github.workspace }}/dist/plugins

      - name: Assert Cloud Storage upload artifact
        run: |
          set -euo pipefail
          plugin_zip="$(find dist/plugins -maxdepth 1 -name 'typedock-cloud-storage-*.zip' -print -quit)"
          test -n "$plugin_zip"
          test "$(stat -c %s "$plugin_zip")" -le 2097152
          unzip -t "$plugin_zip"
          install_dir="$(mktemp -d)"
          trap 'rm -rf "$install_dir"' EXIT
          php -r '
            require $argv[3] . "/vendor/autoload.php";
            $result = (new TypeDock\Core\PluginInstaller($argv[2]))->install($argv[1]);
            if ($result["slug"] !== "cloud-storage") {
                exit(1);
            }
          ' "$plugin_zip" "$install_dir" "dist/typedock-shared/typedock"
          test -f "$install_dir/cloud-storage/vendor/autoload.php"
