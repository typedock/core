# TypeDock Nginx vhost (development).
# Paired with the php-fpm `app` service on port 9000.

server {
    listen 80 default_server;
    server_name _;

    root /app/public;
    index index.php index.html;

    client_max_body_size 64m;

    # Don't leak the nginx version in `Server:` or default error pages.
    server_tokens off;

    # Pretty URLs — route everything to index.php.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM upstream.
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 120;
    }

    # Deny access to Apache overrides and any dotfile.
    location ~ /\.ht {
        deny all;
    }
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Static asset caching.
    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|svg|ico|woff2?|ttf|eot)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Block PHP execution in uploads directory.
    location ^~ /uploads/ {
        location ~ \.php$ { deny all; }
    }

    access_log /var/log/nginx/typedock.access.log;
    error_log  /var/log/nginx/typedock.error.log;
}
