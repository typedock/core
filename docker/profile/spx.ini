; SPX is enabled only in Dockerfile.profile.
; Never expose this profiling UI on a public or production endpoint.
spx.http_enabled = 1
spx.http_key = "${SPX_HTTP_KEY}"

; Requests reach PHP-FPM from the container-local nginx process. Access to the
; host port must therefore be restricted to loopback when the container runs.
spx.http_ip_whitelist = "*"

spx.data_dir = "/app/storage/spx"
