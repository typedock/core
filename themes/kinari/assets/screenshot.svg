    <rect x="460" y="266" width="152" height="66" rx="6" fill="#ffffff" stroke="#e6e3dd" stroke-width="1"/>
    <rect x="474" y="280" width="70" height="8" rx="2" fill="#1f1d1b"/>
    <rect x="474" y="290" width="24" height="2" fill="#8c2a3a"/>
    <rect x="474" y="300" width="40" height="14" rx="7" fill="#f3f1ed"/>
    <rect x="520" y="300" width="50" height="14" rx="7" fill="#f3f1ed"/>
    <rect x="474" y="318" width="50" height="14" rx="7" fill="#f3f1ed"/>

    <!-- footer -->
    <rect x="0" y="348" width="640" height="52" fill="#1f1d1b"/>
    <rect x="40" y="364" width="150" height="6" rx="2" fill="#ede8e0"/>
